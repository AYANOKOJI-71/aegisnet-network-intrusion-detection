[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisnet-network-intrusion-detection"
version = "1.0.0"
description = "Safe synthetic network intrusion detection and security operations lab"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "prometheus-client>=0.21,<0.22",
  "psycopg[binary]>=3.2,<3.3",
  "scapy>=2.5,<2.7",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<0.29", "pytest>=8.3,<8.4", "ruff>=0.8,<0.9"]

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api/src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
